spring.application.name=sample
spring.datasource.url=jdbc:sqlserver://azure-training-sql-server1.database.windows.net:1433;database=azure-training-db;user=sql-server@azure-training-sql-server1;password=Azure@123;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
spring.datasource.username=sql-server@azure-training-sql-server1
spring.datasource.password=Azure@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.servlet.multipart.file-size-threshold=2MB

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=20MB

server.port=${PORT:8080}

azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
